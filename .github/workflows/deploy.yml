name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Refresh the Google-friendly listing pages (only does anything once the new search is live)
    - cron: '17 */4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gate:
    # Scheduled runs only publish after go-live (data/listing-pages-on exists)
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ -f data/listing-pages-on ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build listing pages from the live MLS feed (after go-live)
        if: hashFiles('data/listing-pages-on') != ''
        continue-on-error: ${{ github.event_name != 'schedule' }}
        run: python3 tools/build_listing_pages.py
      - name: Add schema.org data to any page missing it (helps Google and AI assistants)
        continue-on-error: true
        run: python3 tools/add_page_schema.py
      - name: Force browsers to load the latest design files
        run: find . -name "*.html" -not -path "./.git/*" -exec sed -i "s/?v=BUILD/?v=${GITHUB_SHA::7}/g" {} +
      - name: Keep build tools off the public site
        run: rm -rf tools
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Clear any stuck earlier publish
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in 59ab67315a3156bcf53d6025b23c66d39e59aae1 ${{ github.event.before }}; do
            gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" 2>&1 | head -2 || true
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # GitHub sometimes fails to find the upload for a moment ("Fetching artifact metadata failed"): try again after a short wait
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

  indexnow:
    # Tell Bing (and other IndexNow search engines: Yandex, Seznam, Naver...) which pages are new or changed.
    #  - push: the site pages changed in that commit
    #  - schedule: once a day (the 12:17 UTC run), every listing page added or changed in the last 2 days
    #  - manual run (workflow_dispatch): every page on the site, including all listing pages
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Submit pages to IndexNow
        env:
          KEY: b53b2d172794472fa3604e6999f0cc64
          EVENT: ${{ github.event_name }}
        run: |
          sleep 30
          python3 - <<'PY'
          import os, re, subprocess, json, datetime, urllib.request, urllib.error
          site = "https://605homesearch.com"
          event = os.environ["EVENT"]
          skip = ("tools/", "automation/", "google", "thank-you", "review/", "search-preview/", "lp/", "es/lp/")
          all_urls = re.findall(r"<loc>([^<]+)</loc>", open("sitemap.xml").read())

          def listing_urls(days=None):
              """Listing pages from the live homes-sitemap.xml (built during publish, not in the repo)."""
              try:
                  sm = urllib.request.urlopen(site + "/homes-sitemap.xml?n=" + os.environ.get("GITHUB_RUN_ID", ""), timeout=60).read().decode()
              except Exception as e:
                  print("Couldn't read homes-sitemap.xml:", e); return []
              rows = re.findall(r"<loc>([^<]+)</loc>(?:<lastmod>([^<]+)</lastmod>)?", sm)
              if days is None:
                  return [u for u, _ in rows]
              since = (datetime.datetime.utcnow().date() - datetime.timedelta(days=days)).isoformat()
              return [u for u, d in rows if d and d[:10] >= since]

          urls = []
          if event == "push":
              try:
                  files = subprocess.check_output(["git", "diff", "--name-only", "HEAD~1", "HEAD"], text=True).split()
              except Exception:
                  files = []
              for f in files:
                  if not f.endswith(".html") or f.startswith(skip) or not os.path.exists(f):
                      continue
                  urls.append(site + "/" + (f[:-10] if f.endswith("index.html") else f))
              if "sitemap.xml" in files:
                  urls.append(site + "/sitemap.xml")
          elif event == "schedule":
              if datetime.datetime.utcnow().hour != 12:
                  print("Listing pages go to IndexNow once a day (12:17 UTC run); nothing to do now."); raise SystemExit(0)
              urls = listing_urls(days=2) + [site + "/homes-sitemap.xml"]
          else:
              urls = all_urls + listing_urls() + [site + "/sitemap.xml", site + "/homes-sitemap.xml"]

          urls = sorted(set(u for u in urls if u.startswith(site + "/")))
          print("Submitting", len(urls), "URLs"); print("\n".join(urls[:40]) + ("\n..." if len(urls) > 40 else ""))
          if not urls:
              raise SystemExit(0)
          for i in range(0, len(urls), 10000):  # IndexNow takes up to 10,000 URLs per request
              body = json.dumps({"host": "605homesearch.com", "key": os.environ["KEY"],
                                 "keyLocation": f"{site}/{os.environ['KEY']}.txt", "urlList": urls[i:i + 10000]}).encode()
              req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                           headers={"Content-Type": "application/json; charset=utf-8"})
              try:
                  r = urllib.request.urlopen(req, timeout=60); print("IndexNow status:", r.status)
              except urllib.error.HTTPError as e:
                  print("IndexNow status:", e.code, e.read()[:300])
          PY
