name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Force browsers to load the latest design files
        run: find . -name "*.html" -not -path "./.git/*" -exec sed -i "s/?v=BUILD/?v=${GITHUB_SHA::7}/g" {} +
      - name: Keep build tools off the public site
        run: rm -rf tools
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Clear any stuck earlier publish
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in 59ab67315a3156bcf53d6025b23c66d39e59aae1 ${{ github.event.before }}; do
            gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" 2>&1 | head -2 || true
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    # Tell Bing (and other IndexNow search engines) which pages changed
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Submit changed pages to IndexNow
        env:
          KEY: b53b2d172794472fa3604e6999f0cc64
          EVENT: ${{ github.event_name }}
        run: |
          sleep 30
          python3 - <<'PY'
          import os, re, subprocess, json, urllib.request
          site = "https://605homesearch.com"
          skip = ("tools/", "automation/", "google", "thank-you", "review/")
          sm = open("sitemap.xml").read()
          all_urls = re.findall(r"<loc>([^<]+)</loc>", sm)
          urls = []
          if os.environ["EVENT"] == "push":
              try:
                  files = subprocess.check_output(["git", "diff", "--name-only", "HEAD~1", "HEAD"], text=True).split()
              except Exception:
                  files = []
              for f in files:
                  if not f.endswith(".html") or f.startswith(skip) or not os.path.exists(f):
                      continue
                  path = "/" + (f[:-10] if f.endswith("index.html") else f)
                  urls.append(site + path)
              if any(f in ("sitemap.xml",) for f in files):
                  urls.append(site + "/sitemap.xml")
          else:
              urls = all_urls
          urls = sorted(set(urls))[:10000]
          print("Submitting", len(urls), "URLs"); print("\n".join(urls))
          if not urls:
              raise SystemExit(0)
          body = json.dumps({"host": "605homesearch.com", "key": os.environ["KEY"],
                             "keyLocation": f"{site}/{os.environ['KEY']}.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          try:
              r = urllib.request.urlopen(req, timeout=30); print("IndexNow status:", r.status)
          except urllib.error.HTTPError as e:
              print("IndexNow status:", e.code, e.read()[:300])
          PY
